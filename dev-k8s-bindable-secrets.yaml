# dev-k8s-bindable-secrets.yaml — apply separately, not via Helm values
#
# kubectl apply -f dev-k8s-bindable-secrets.yaml
#
# Replace my-bq-secret.config with real GCP service account JSON for BigQuery testing.
# Replace my-secret.api_key with a real Exa API key from https://dashboard.exa.ai/api-keys
apiVersion: v1
kind: Secret
metadata:
  name: mcp-api-credentials
  namespace: obot
  labels:
    obot.obot.ai/allow-secret-binding: "true"   # value ignored; presence required
type: Opaque
stringData:
  api_key: "dev-example-api-key"
  client_secret: "dev-example-client-secret"
---
apiVersion: v1
kind: Secret
metadata:
  name: mcp-remote-token
  namespace: obot
  labels:
    obot.obot.ai/allow-secret-binding: "true"
type: Opaque
stringData:
  token: "Bearer dev-remote-token"
---
# Bound by "Sangee BigQuery Toolbox SecretBinding" catalog entry:
#   GOOGLE_APPLICATION_CREDENTIALS.secretBinding.name = my-bq-secret
#   GOOGLE_APPLICATION_CREDENTIALS.secretBinding.key   = config
apiVersion: v1
kind: Secret
metadata:
  name: my-bq-secret
  namespace: obot
  labels:
    obot.obot.ai/allow-secret-binding: "true"
type: Opaque
stringData:
  config: |
    {
      "type": "service_account",
      "project_id": "REPLACE_WITH_YOUR_GCP_PROJECT_ID",
      "private_key_id": "REPLACE_ME",
      "private_key": "-----BEGIN PRIVATE KEY-----\nREPLACE_WITH_SERVICE_ACCOUNT_PRIVATE_KEY\n-----END PRIVATE KEY-----\n",
      "client_email": "REPLACE_WITH_SERVICE_ACCOUNT_EMAIL",
      "client_id": "000000000000000000000",
      "auth_uri": "https://accounts.google.com/o/oauth2/auth",
      "token_uri": "https://oauth2.googleapis.com/token",
      "auth_provider_x509_cert_url": "https://www.googleapis.com/oauth2/v1/certs",
      "client_x509_cert_url": "https://www.googleapis.com/robot/v1/metadata/x509/REPLACE_WITH_SERVICE_ACCOUNT_EMAIL",
      "universe_domain": "googleapis.com"
    }
---
# Bound by "Sangee Multi Exa Search SecretBinding" catalog entry:
#   EXA_API_KEY.secretBinding.name = my-secret
#   EXA_API_KEY.secretBinding.key   = api_key
apiVersion: v1
kind: Secret
metadata:
  name: my-secret
  namespace: obot
  labels:
    obot.obot.ai/allow-secret-binding: "true"
type: Opaque
stringData:
  api_key: "REPLACE_WITH_YOUR_EXA_API_KEY"
