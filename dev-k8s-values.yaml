# Local development values for deploying Obot to k3d cluster via Helm
# Includes Claude Environments and a local RustFS snapshot bucket.
# Infrastructure credentials are generated by deploy-to-k3d.sh.

# Use embedded DB for local testing (not for production!)
dev:
  useEmbeddedDb: true

# Use locally built image (built by deploy script)
image:
  repository: obot
  tag: "local"
  pullPolicy: Never

# Access through kubectl port-forward
service:
  type: ClusterIP
  port: 80

# MCP Configuration - use Kubernetes backend
config:
  OBOT_SERVER_HOSTNAME: "http://localhost:8080"
  OBOT_SERVER_SUBSTRATE_SNAPSHOT_LOCATION: "s3://obot-snapshots/claude/"
  OBOT_SERVER_SUBSTRATE_NAMESPACE: "obot-agents"
  # Enable Kubernetes backend for MCP servers
  OBOT_SERVER_MCPRUNTIME_BACKEND: "kubernetes"
  
  # MCP namespace and image settings
  OBOT_SERVER_MCPBASE_IMAGE: "ghcr.io/obot-platform/mcp-images/phat:main"
  OBOT_SERVER_MCPNAMESPACE: "obot-mcp"
  OBOT_SERVER_MCPCLUSTER_DOMAIN: "cluster.local"
  
  # Optional: Enable authentication for more realistic testing
  OBOT_SERVER_ENABLE_AUTHENTICATION: true
  
  # Dev mode settings
  OBOT_DEV_MODE: false  # Set to true for debug logging
  
  # Optional: Set owner email if auth is enabled
  # OBOT_SERVER_AUTH_OWNER_EMAILS: "your-email@example.com"
  OBOT_SERVER_HIDE_K8S_DETAILS: false

  # Initial local-auth owner (requires matching secret.OBOT_SERVER_LOCAL_AUTH_INITIAL_OWNER_SETUP_TOKEN)
  OBOT_SERVER_LOCAL_AUTH_INITIAL_OWNER_EMAIL: "ivy@obot.ai"

# Sensitive values (stored in a Kubernetes Secret)
secret:
  # Must be at least 32 characters; used in the initial owner setup link
  OBOT_SERVER_LOCAL_AUTH_INITIAL_OWNER_SETUP_TOKEN: "test1234-test1234-test1234-test1234"

# Resource limits (adjust as needed for local machine)
resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: 2000m
    memory: 2Gi

# Single replica for local testing
replicaCount: 1


# The chart supplies Obot's internal Substrate and callback addresses.
substrate:
  enabled: true
  apiServer:
    replicas: 1
  postgres:
    # Separate bundled PostgreSQL, never Obot's embedded database.
    storageSize: 8Gi
    storageClass: local-path
  storage:
    backend: s3
    existingSecret: dev-substrate-storage
    env:
      AWS_REGION: "us-east-1"
      AWS_ENDPOINT_URL: "http://dev-rustfs.ate-system.svc.cluster.local:9000"
      AWS_S3_USE_PATH_STYLE: "true"
      AWS_EC2_METADATA_DISABLED: "true"

persistence:
  enabled: true

ingress:
  enabled: false
